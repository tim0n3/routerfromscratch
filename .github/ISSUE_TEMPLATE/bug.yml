name: Bug report
description: Report a defect or regression
title: "bug: "
labels: ["type/bug", "status/triage"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened and why is it a problem?
      placeholder: Short, clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the steps needed to reproduce.
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: What should have happened?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      placeholder: What happened instead?
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, version, and any relevant context.
      placeholder: "Debian 12, bare metal or VM"
    validations:
      required: false
