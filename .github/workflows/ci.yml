name: ci

on:
  pull_request:
  push:
    branches:
      - dev
      - staging
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pre-commit
        uses: pre-commit/action@v3.0.1

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run make ci
        run: make ci
